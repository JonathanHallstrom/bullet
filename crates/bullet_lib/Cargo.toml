[package]
name = "bullet_lib"
version = "1.0.0"
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
description = "Neural Network Trainer"

[dependencies]
bullet-compiler = { workspace = true }
bullet-gpu = { workspace = true }
bullet-trainer = { workspace = true }
bulletformat = "1.8.0"
montyformat = "0.9.2"
sfbinpack = "0.6.4"
viriformat = "2.0.1"
rand = "0.9"
bytemuck = { version = "1.24.0", default-features = false, features = [
    "extern_crate_std",
    "latest_stable_rust",
]}
glob = "0.3.3"

[features]
cuda = ["bullet-gpu/cuda", "bullet-trainer/cuda"]
rocm = ["bullet-gpu/rocm", "bullet-trainer/rocm"]
metal = ["bullet-gpu/metal", "bullet-trainer/metal"]

